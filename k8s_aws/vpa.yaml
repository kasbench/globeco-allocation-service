{{- if eq .Values.autoscaler "vpa" -}}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: globeco-allocation-service-vpa
  namespace: globeco
  labels:
    app: globeco-allocation-service
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: globeco-allocation-service
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: globeco-allocation-service
        minAllowed:
          cpu: 100m
          memory: 200Mi
        maxAllowed:
          cpu: 2000m
          memory: 2Gi
        controlledResources: ["cpu", "memory"]
        controlledValues: RequestsAndLimits
{{- end -}}
