apiVersion: v1
kind: ServiceAccount
metadata:
  name: globeco-allocation-service
  namespace: globeco
  labels:
    app: globeco-allocation-service
    component: backend
    version: v1
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: globeco
  name: batch-job-manager
  labels:
    app: globeco-allocation-service
    component: rbac
rules:
# Batch job management permissions
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
# Pod access for job monitoring and log retrieval
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# Pod log access for debugging
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
# ConfigMap access for job configuration
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
# PVC access for NFS share mounting
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: allocation-service-batch-jobs
  namespace: globeco
  labels:
    app: globeco-allocation-service
    component: rbac
subjects:
- kind: ServiceAccount
  name: globeco-allocation-service
  namespace: globeco
roleRef:
  kind: Role
  name: batch-job-manager
  apiGroup: rbac.authorization.k8s.io